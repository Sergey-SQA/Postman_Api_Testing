name: Scheduled Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose Environment for Test Run'
        required: true
        default: 'prod'
        type: 'choice'
        options:
          - prod
          - test 
      # --- ДОБАВЛЕНО: Ввод для выбора ОС ---
      runner:
        description: 'Choose Operating System'
        required: true
        default: 'ubuntu-latest'
        type: 'choice'
        options:
          - ubuntu-latest
          - windows-latest
          
  schedule:
    - cron: '30 18 * * 1-5'
    
jobs:
  build:
    # --- ИЗМЕНЕНО: Динамический runs-on ---
    # Используем input, если он есть (при workflow_dispatch),
    # или 'ubuntu-latest' по умолчанию (при schedule)
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    
    steps:
      # Check out the repo, so the job can access it.   
      - uses: actions/checkout@v4
  
      # Install Node on the runner
      - name: Use Node.js      
        uses: actions/setup-node@v3
        
      # Install newman globally, and install the html extra reporter
      # Используем 'shell: bash', чтобы команды 'npm' работали
      # одинаково на Linux и Windows
      - name: Install newman
        shell: bash
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
  
      # Run postman collection
      - name: Run Postman Collection and Generate HTML Report
        shell: bash
        run: 'newman run Trello.postman_collection.json --reporters cli,htmlextra --reporter-htmlextra-export report.html'
      
      # Make sure that the report has been created
      # 'ls' - это команда Linux. Для Windows нужна 'dir'.
      # Используя 'shell: bash', мы гарантируем, что 'ls' сработает везде.
      - name: Check Files
        shell: bash
        run: 'ls' 
        
      # Upload the reports to TestArtifacts directory
      - name: Output the results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: Reports
          path: "*html"
