name: Scheduled Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose Environment for Test Run'
        required: true
        default: 'prod'
        type: 'choice'
        options:
          - prod
          - test 

      os:
        description: 'Choose Operating System'
        required: true
        default: 'ubuntu'
        type: 'choice'
        options:
          - ubuntu
          - windows
          
  schedule:
    - cron: '30 18 * * 1-5'
    
jobs:
  build:

    runs-on: ${{ inputs.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    
    steps:
      - uses: actions/checkout@v4
  
      - name: Use Node.js      
        uses: actions/setup-node@v3
        
      # Используем 'shell: bash', чтобы команды 'npm' работали
      # одинаково на Linux и Windows
      - name: Install newman
        shell: bash
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
  
      - name: Run Postman Collection and Generate HTML Report
        shell: bash
        run: 'newman run Trello.postman_collection.json --reporters cli,htmlextra --reporter-htmlextra-export report.html'
      
      - name: Check Files
        shell: bash
        run: 'ls' 
        
      - name: Output the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reports
          path: "*html"
          
      - name: Send report via email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: serpol.jb87@gmail.com
          subject: Test Report
          from: GitHub Actions <actions@example.com>
          attachments: report.html    
