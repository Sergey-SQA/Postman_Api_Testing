name: Scheduled Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose Environment for Test Run'
        required: true
        default: 'prod'
        type: 'choice'
        options:
          - prod
          - test 
      # --- ИЗМЕНЕНО: Короткие и понятные имена ---
      os:
        description: 'Choose Operating System'
        required: true
        default: 'ubuntu'
        type: 'choice'
        options:
          - ubuntu
          - windows
          
  schedule:
    - cron: '30 18 * * 1-5'
    
jobs:
  build:
    # --- ИЗМЕНЕНО: Используем тернарный оператор для маппинга ---
    # Это выражение работает и для 'workflow_dispatch', и для 'schedule'
    runs-on: ${{ inputs.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    
    steps:
      - uses: actions/checkout@v4
  
      - name: Use Node.js      
        uses: actions/setup-node@v3
        
      # Используем 'shell: bash', чтобы команды 'npm' работали
      # одинаково на Linux и Windows
      - name: Install newman
        shell: bash
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
  
      - name: Run Postman Collection and Generate HTML Report
        shell: bash
        run: 'newman run Trello.postman_collection.json --reporters cli,htmlextra --reporter-htmlextra-export report.html'
      
      - name: Check Files
        shell: bash
        run: 'ls' 
        
      - name: Output the results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: Reports
          path: "*html"
